[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "iroll"
version = "0.5.0"
description = "Prepare SDKs, build Idle components and initialize SD data cards without launching applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "BSD-3-Clause"
license-files = ["LICENSE"]

[project.scripts]
iroll = "iroll.cli:main"

[dependency-groups]
dev = [{include-group = "tests"}, "ruff>=0.12,<1"]
tests = ["pytest>=8,<10"]

[tool.hatch.build]
exclude = [
    ".venv*", "__pycache__", ".cache", ".pytest_cache", ".ruff_cache", "target",
    "*.pyc", "*.lock", ".env", "firmware", "dumps", "in", "out", "tmp", "logs", "dist", "build",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iroll"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/iroll", "tests", ".github/workflows/python-package.yml",
    "docs", "README.md", "LICENSE", "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
